name: 🤖 EPL 스카우트팀 일일 개발 루프

on:
  schedule:
    - cron: '15 0 * * *'   # 00:15 UTC = 09:15 KST
  workflow_dispatch:         # 수동 실행 버튼

permissions:
  contents: write

jobs:
  dev-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 90      # 모델 학습 + Streamlit 체크 포함

    steps:
      - name: 📥 레포 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 ML 의존성 설치
        run: |
          pip install --quiet \
            pandas pyarrow \
            scikit-learn \
            xgboost lightgbm \
            optuna \
            joblib numpy \
            matplotlib seaborn

      - name: 🤖 액션아이템 → 기존 스크립트 학습 실행
        run: python scripts/github_actions_dev.py

      - name: 📤 변경사항 커밋 & 푸시
        run: |
          git config user.email "epl-dev-bot@github-actions"
          git config user.name "EPL Dev Bot"
          git add -A
          if git diff --staged --quiet; then
            echo "변경사항 없음 — 커밋 스킵"
          else
            TODAY=$(date +'%Y-%m-%d')
            git commit -m "auto(actions/${TODAY}): 미팅 액션아이템 구현 + 모델 학습"
            # 원격에 새 커밋이 있을 경우 fetch → merge (ours=runner결과 우선)
            git fetch origin master
            git merge -X ours origin/master --no-edit
            git push
          fi

      - name: 🌐 Playwright 설치
        run: |
          pip install --quiet playwright
          playwright install chromium --with-deps

      - name: 🔍 Streamlit Cloud 에러 체크
        env:
          STREAMLIT_CHECK: "1"
          STREAMLIT_WAIT_SEC: "90"
        run: python scripts/github_actions_dev.py
        continue-on-error: true   # 에러 감지돼도 워크플로우 전체 실패 처리 안 함 (결과만 로그)

name: 🤖 EPL 스카우트팀 일일 개발 루프

on:
  schedule:
    - cron: '50 20 * * *'  # 20:50 UTC → 실제 실행 ~00:15 UTC = 09:15 KST
                           # GitHub Actions 평균 지연 3h24m 역산 적용
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  dev-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONWARNINGS: "ignore"          # 모든 Python 프로세스 warning 전역 억제 (자식 프로세스 포함)
      PIP_NO_WARN_SCRIPT_LOCATION: "1"  # pip script 위치 경고 억제
      DEBIAN_FRONTEND: noninteractive   # apt 대화형 프롬프트 비활성화

    steps:
      - name: 📥 레포 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: 🐍 Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 ML 의존성 설치
        run: |
          pip install --quiet --no-warn-script-location \
            pandas pyarrow \
            scikit-learn \
            xgboost lightgbm \
            optuna \
            joblib numpy \
            matplotlib seaborn \
            imbalanced-learn

      - name: 🤖 액션아이템 → 기존 스크립트 학습 실행
        run: python -W ignore scripts/github_actions_dev.py

      - name: 📤 변경사항 커밋 & 푸시
        run: |
          git config core.autocrlf false
          git config core.safecrlf false
          git config user.email "epl-dev-bot@github-actions"
          git config user.name "EPL Dev Bot"
          git add -A
          if git diff --staged --quiet; then
            echo "변경사항 없음 — 커밋 스킵"
          else
            TODAY=$(date +'%Y-%m-%d')
            git commit -m "auto(actions/${TODAY}): 미팅 액션아이템 구현 + 모델 학습"
            git fetch --no-progress origin master
            git merge -s recursive -X ours origin/master --no-edit 2>/dev/null || true
            git push
          fi

      - name: 🌐 Playwright 설치
        run: |
          pip install --quiet --no-warn-script-location playwright
          playwright install chromium --with-deps > /tmp/pw_log.txt 2>&1 || \
            (echo "❌ Playwright 설치 실패:" && cat /tmp/pw_log.txt && exit 1)

      - name: 🔍 Streamlit Cloud 에러 체크
        env:
          STREAMLIT_CHECK: "1"
          STREAMLIT_WAIT_SEC: "90"
        run: python -W ignore scripts/github_actions_dev.py
        continue-on-error: true

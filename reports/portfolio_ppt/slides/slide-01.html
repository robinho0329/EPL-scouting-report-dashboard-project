<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 720pt; height: 405pt;
    background: #0d1117;
    font-family: 'Pretendard', system-ui, -apple-system, sans-serif;
    color: #e6edf3;
    overflow: hidden;
    padding: 32pt 48pt 28pt 48pt;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
</style>
</head>
<body>
  <!-- Top bar (3pt accent bar simulated with a narrow div) -->
  <div style="position: absolute; top: 0; left: 0; width: 720pt; height: 3pt; background: #e94560;"></div>

  <!-- Header row -->
  <div style="display: flex; justify-content: space-between; align-items: flex-start; padding-top: 6pt;">
    <!-- Left: brand badge -->
    <div style="display: flex; align-items: center; gap: 9pt;">
      <div style="width: 30pt; height: 30pt; background: #e94560; border-radius: 5pt; display: flex; align-items: center; justify-content: center;">
        <p style="font-size: 16pt; font-weight: 900; color: #ffffff; line-height: 1;">E</p>
      </div>
      <div>
        <p style="font-size: 9.5pt; color: #f5a623; font-weight: 700; line-height: 1.3;">22번째 정기 미팅</p>
        <p style="font-size: 8pt; color: #8b949e; letter-spacing: 0.12em; text-transform: uppercase; line-height: 1.3;">EPL Scout Intelligence</p>
      </div>
    </div>

    <!-- Right: score badge -->
    <div style="text-align: center; background: #16213e; border: 1.5pt solid #f5a623; border-radius: 10pt; padding: 8pt 14pt;">
      <p style="font-size: 24pt; font-weight: 800; color: #f5a623; line-height: 1;">4.85</p>
      <p style="font-size: 10pt; color: #8b949e;">/ 5.0</p>
      <p style="font-size: 7.5pt; color: #8b949e; margin-top: 3pt;">종합 평가 점수</p>
      <p style="font-size: 8pt; color: #8b949e; margin-top: 3pt;">&#8594; 전일 대비 유지</p>
    </div>
  </div>

  <!-- Main content center -->
  <div style="text-align: center; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8pt;">
    <p style="font-size: 9pt; letter-spacing: 0.22em; color: #8b949e; text-transform: uppercase;">EPL Scout Intelligence &nbsp;&middot;&nbsp; Daily Briefing</p>
    <h1 style="font-size: 40pt; font-weight: 900; color: #e6edf3; line-height: 1.05; letter-spacing: -0.02em;">데일리 브리핑</h1>
    <h2 style="font-size: 16pt; font-weight: 600; color: #e94560;">2026년 05월 13일 (수)</h2>
    <p style="font-size: 10.5pt; color: #8b949e;">수요일 정기 미팅 &nbsp;&middot;&nbsp; 2026-05-13</p>

    <!-- Divider -->
    <div style="width: 52pt; height: 2.5pt; background: #e94560; margin: 4pt auto; border-radius: 2pt;"></div>

    <!-- Slogan box -->
    <div style="background: #0f3460; border: 1.5pt solid #e94560; border-left: 4pt solid #e94560; border-radius: 8pt; padding: 12pt 22pt; max-width: 490pt; text-align: left;">
      <p style="font-size: 12.5pt; font-weight: 700; color: #e6edf3; line-height: 1.5;">"워크플로 yml 경로 한 줄 &mdash; 6일 연속 미달의 진짜 해법"</p>
      <p style="font-size: 9pt; color: #8b949e; margin-top: 4pt; line-height: 1.4;">train_v5_1.py는 이미 완성돼 있었다. 오늘 워크플로 경로 한 줄만 바꾸면 된다.</p>
    </div>
  </div>

  <!-- Attendee bar -->
  <div style="display: flex; justify-content: center; gap: 26pt; padding-bottom: 4pt;">
    <div style="display: flex; align-items: center; gap: 6pt;">
      <div style="width: 6pt; height: 6pt; background: #f5a623; border-radius: 50%;"></div>
      <p style="font-size: 9pt; color: #8b949e;"><span style="font-weight: 700; color: #e6edf3;">김태현</span> 스카우트</p>
    </div>
    <div style="display: flex; align-items: center; gap: 6pt;">
      <div style="width: 6pt; height: 6pt; background: #f5a623; border-radius: 50%;"></div>
      <p style="font-size: 9pt; color: #8b949e;"><span style="font-weight: 700; color: #e6edf3;">Marcus Webb</span> Analytics Agent</p>
    </div>
  </div>

  <div style="position: absolute; bottom: 0; left: 0; width: 720pt; height: 2pt; background: #0f3460;"></div>
</body>
</html>

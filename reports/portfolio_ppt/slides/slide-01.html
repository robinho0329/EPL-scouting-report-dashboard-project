<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 720pt;
    height: 405pt;
    background: #0d1117;
    font-family: 'Pretendard', 'Noto Sans KR', -apple-system, sans-serif;
    color: #e6edf3;
    overflow: hidden;
    position: relative;
  }
  :root {
    --accent: #e94560;
    --gold: #f5a623;
    --green: #00d26a;
    --muted: #8b949e;
    --surface: #16213e;
    --blue-hl: #58a6ff;
  }
  .left-bar {
    position: absolute;
    left: 0; top: 0;
    width: 5pt; height: 100%;
    background: var(--accent);
  }
  .shield-icon {
    position: absolute;
    top: 18pt; right: 30pt;
    width: 38pt;
    height: 46pt;
    background: rgba(233,69,96,0.13);
    border: 1.5pt solid var(--accent);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .shield-icon p {
    font-size: 18pt;
    font-weight: 900;
    color: var(--accent);
    line-height: 1;
  }
  .main {
    position: absolute;
    top: 0; left: 5pt; right: 0; bottom: 50pt;
    padding: 18pt 30pt 0 28pt;
    display: flex;
    flex-direction: column;
  }
  .badge-row {
    display: flex;
    gap: 6pt;
    flex-wrap: wrap;
    margin-bottom: 10pt;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 3pt 9pt;
    border-radius: 20pt;
    font-size: 7.5pt;
    font-weight: 700;
  }
  .b-gold  { background: rgba(245,166,35,0.14); border: 1pt solid var(--gold);   color: var(--gold); }
  .b-green { background: rgba(0,210,106,0.12);  border: 1pt solid var(--green);  color: var(--green); }
  .b-red   { background: rgba(233,69,96,0.16);  border: 1pt solid var(--accent); color: var(--accent); }
  .title-block {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .eyebrow { font-size: 8.5pt; letter-spacing: 0.22em; color: var(--muted); text-transform: uppercase; margin-bottom: 7pt; }
  h1.main-title {
    font-size: 40pt;
    font-weight: 900;
    line-height: 1.05;
    color: #e6edf3;
    margin-bottom: 9pt;
  }
  h1.main-title span { color: var(--accent); }
  p.date-sub {
    font-size: 15pt;
    font-weight: 600;
    color: var(--muted);
  }
  p.date-sub span { color: var(--blue-hl); }
  .rating-badge {
    position: absolute;
    right: 30pt;
    bottom: 62pt;
    background: rgba(233,69,96,0.13);
    border: 2pt solid var(--accent);
    border-radius: 10pt;
    padding: 10pt 18pt;
    text-align: center;
  }
  .rating-badge p.rl  { font-size: 7.5pt; color: var(--muted); margin-bottom: 2pt; }
  .rating-badge p.rv  { font-size: 28pt; font-weight: 900; color: var(--accent); line-height: 1; }
  .rating-badge p.rd  { font-size: 10pt; font-weight: 800; color: var(--accent); }
  .rating-badge p.rp  { font-size: 7.5pt; color: var(--muted); margin-top: 1pt; }
  .slogan {
    position: absolute;
    bottom: 0; left: 5pt; right: 0;
    height: 50pt;
    background: rgba(233,69,96,0.09);
    border-top: 2pt solid var(--accent);
    display: flex;
    align-items: center;
    padding: 0 30pt 0 28pt;
    gap: 10pt;
  }
  .slogan p.msg { font-size: 8.5pt; font-weight: 700; color: var(--accent); line-height: 1.45; flex: 1; }
  .slogan p.sub { font-size: 7.5pt; color: var(--muted); white-space: nowrap; }
</style>
</head>
<body>
  <div class="left-bar"></div>

  <div class="shield-icon">
    <p>E</p>
  </div>

  <div class="main">
    <div class="badge-row">
      <span class="badge b-gold"><p>31번째 정기 미팅 | 09:00 KST</p></span>
      <span class="badge b-green"><p>금요일 - 주말 전 최종 점검</p></span>
      <span class="badge b-red"><p>P7 + P1 11일 연속 미달</p></span>
      <span class="badge b-red"><p>어제 경고 발동 - 4건 중 0건 달성</p></span>
    </div>

    <div class="title-block">
      <p class="eyebrow">EPL Scout Intelligence</p>
      <h1 class="main-title">EPL 스카우트<br><span>인텔리전스</span></h1>
      <p class="date-sub">데일리 브리핑 | <span>2026-05-22 (금)</span></p>
    </div>
  </div>

  <div class="rating-badge">
    <p class="rl">김태현 스카우트 평가</p>
    <p class="rv">4.50</p>
    <p class="rd">&#9660; -0.18</p>
    <p class="rp">전일 4.68 → 경고 발동</p>
  </div>

  <div class="slogan">
    <p class="msg">11일입니다. 어제 경고를 발동했습니다. 오늘 저녁 결과 파일이 없으면 평가 4.40 이하입니다.</p>
    <p class="sub">EPL Scout Bot | 09:00 KST</p>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 720pt;
    height: 405pt;
    background: #0d1117;
    font-family: 'Pretendard', system-ui, -apple-system, sans-serif;
    color: #e6edf3;
    overflow: hidden;
    position: relative;
  }
</style>
</head>
<body>
  <!-- 배경 그리드 -->
  <div style="position:absolute; inset:0;
    background-image: linear-gradient(rgba(15,52,96,0.12) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(15,52,96,0.12) 1px, transparent 1px);
    background-size: 36pt 36pt;">
  </div>

  <!-- 좌측 강조 바 -->
  <div style="position:absolute; left:0; top:0; width:5pt; height:100%;
    background: linear-gradient(180deg, #e94560 0%, #f5a623 100%);"></div>

  <!-- 상단 배지 행 -->
  <div style="position:absolute; top:22pt; left:20pt; display:flex; align-items:center; gap:8pt;">
    <div style="background:#e94560; border-radius:4pt; padding:3pt 9pt;">
      <p style="font-size:7.5pt; font-weight:700; color:#fff; letter-spacing:0.12em; text-transform:uppercase;">EPL Scout Intelligence</p>
    </div>
    <div style="background:#0f3460; border:1pt solid #f5a623; border-radius:4pt; padding:3pt 9pt;">
      <p style="font-size:7.5pt; font-weight:700; color:#f5a623;">23회차 정기 미팅 &middot; 목요일</p>
    </div>
  </div>

  <!-- 참석자 (우상단) -->
  <div style="position:absolute; top:18pt; right:28pt; text-align:right;">
    <p style="font-size:7.5pt; color:#8b949e; margin-bottom:3pt;">참석자</p>
    <p style="font-size:9pt; font-weight:700; color:#e6edf3; line-height:1.5;">김태현 스카우트</p>
    <p style="font-size:9pt; font-weight:700; color:#e6edf3; line-height:1.5;">Marcus Webb</p>
    <p style="font-size:7.5pt; color:#8b949e;">Analytics Agent</p>
  </div>

  <!-- 중앙 타이틀 블록 -->
  <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; width:520pt;">
    <p style="font-size:9pt; letter-spacing:0.24em; color:#8b949e; text-transform:uppercase; margin-bottom:10pt;">Daily Briefing</p>
    <h1 style="font-size:42pt; font-weight:900; line-height:1.05; color:#e6edf3; letter-spacing:-0.02em; margin-bottom:8pt;">EPL 스카우트 인텔리전스</h1>
    <div style="width:72pt; height:3pt; background:linear-gradient(90deg,#e94560,#f5a623); margin:0 auto 12pt;"></div>
    <h2 style="font-size:18pt; font-weight:700; color:#e94560; margin-bottom:6pt;">데일리 브리핑</h2>
    <p style="font-size:14pt; font-weight:500; color:#e6edf3;">2026년 5월 14일 (목)</p>
  </div>

  <!-- 점수 배지 (우하단) -->
  <div style="position:absolute; bottom:40pt; right:28pt; background:#16213e;
    border:2pt solid #f5a623; border-radius:10pt; padding:10pt 16pt; text-align:center;">
    <p style="font-size:7.5pt; color:#8b949e; margin-bottom:4pt;">스카우트 종합 평가</p>
    <p style="font-size:28pt; font-weight:900; color:#f5a623; line-height:1;">4.80</p>
    <p style="font-size:9.5pt; color:#8b949e;">/ 5.0</p>
    <p style="font-size:8.5pt; color:#e94560; font-weight:700; margin-top:4pt;">&#9660; 0.05 &nbsp;(전일 4.85)</p>
  </div>

  <!-- 슬로건 박스 (하단 좌측) -->
  <div style="position:absolute; bottom:20pt; left:20pt; right:200pt;
    background:rgba(42,10,10,0.88); border:1.5pt solid #e94560;
    border-left:4pt solid #e94560; border-radius:6pt; padding:9pt 14pt;">
    <p style="font-size:10.5pt; font-weight:800; color:#e94560; margin-bottom:4pt;">7일 연속 미완료 &mdash; 오늘이 마지막</p>
    <p style="font-size:7.5pt; color:#8b949e; line-height:1.45;">P1 &middot; P7 오전 즉시 커밋 없으면 내일 아침 P1 대시보드 페이지 비활성화</p>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 720pt;
    height: 405pt;
    background: #0d1117;
    font-family: 'Pretendard', 'Noto Sans KR', -apple-system, sans-serif;
    color: #e6edf3;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: row;
  }
  .left-bar {
    width: 5pt;
    min-width: 5pt;
    height: 405pt;
    background: #e94560;
    flex-shrink: 0;
  }
  .content-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 24pt 100pt 24pt 20pt;
    position: relative;
  }
  .badge {
    display: inline-block;
    padding: 2.5pt 7pt;
    border-radius: 3pt;
    font-size: 7pt;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .badge-muted {
    background: rgba(139,148,158,0.12);
    border: 0.75pt solid rgba(139,148,158,0.22);
  }
  .badge-accent {
    background: rgba(233,69,96,0.14);
    border: 0.75pt solid rgba(233,69,96,0.38);
  }
  .top-row {
    display: flex;
    align-items: center;
    gap: 6pt;
    margin-bottom: 12pt;
    flex-wrap: nowrap;
  }
  .divider {
    width: 50pt; height: 3pt;
    background: #e94560;
    border-radius: 2pt;
    margin-bottom: 10pt;
  }
  .subtitle-row {
    display: flex;
    align-items: center;
    gap: 9pt;
    margin-bottom: 14pt;
  }
  .slogan-banner {
    background: rgba(233,69,96,0.07);
    border: 0.75pt solid rgba(233,69,96,0.3);
    border-left: 3pt solid #e94560;
    border-radius: 4pt;
    padding: 6pt 11pt;
    margin-bottom: 14pt;
  }
  .footer-row {
    display: flex;
    align-items: center;
    gap: 7pt;
  }
  .rating-panel {
    position: absolute;
    right: 10pt;
    bottom: 18pt;
    background: #1a1a2e;
    border: 1.5pt solid #e94560;
    border-radius: 9pt;
    padding: 7pt 13pt;
    text-align: center;
    min-width: 68pt;
  }
  .shield-panel {
    position: absolute;
    top: 18pt;
    right: 10pt;
    background: #1a1a2e;
    border: 1.5pt solid #e94560;
    border-radius: 4pt 4pt 22pt 22pt;
    width: 46pt;
    height: 50pt;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>
  <div class="left-bar"></div>

  <div class="content-area">
    <!-- 방패 아이콘 -->
    <div class="shield-panel">
      <p style="font-size:10pt; font-weight:900; color:#e94560; letter-spacing:0.04em;">EPL</p>
    </div>

    <!-- 상단 배지 행 -->
    <div class="top-row">
      <span class="badge badge-muted">
        <p style="font-size:6.5pt; font-weight:700; color:#8b949e; white-space:nowrap;">EPL SCOUT INTELLIGENCE</p>
      </span>
      <span class="badge badge-muted">
        <p style="font-size:6.5pt; font-weight:700; color:#8b949e; white-space:nowrap;">28번째 정기 미팅 | 09:00 KST</p>
      </span>
      <span class="badge badge-accent">
        <p style="font-size:6.5pt; font-weight:700; color:#e94560; white-space:nowrap;">포트폴리오 리허설 D-1</p>
      </span>
    </div>

    <!-- 메인 타이틀 -->
    <h1 style="font-size:38pt; font-weight:800; color:#e6edf3; line-height:1.06; letter-spacing:-0.02em; margin-bottom:8pt;">
      EPL 스카우트<br>
      <span style="color:#e94560;">인텔리전스</span>
    </h1>

    <!-- 구분선 -->
    <div class="divider"></div>

    <!-- 서브타이틀 -->
    <div class="subtitle-row">
      <h2 style="font-size:11pt; font-weight:600; color:#8b949e;">데일리 브리핑</h2>
      <span style="color:#30363d; font-size:13pt; line-height:1;">|</span>
      <h2 style="font-size:11pt; font-weight:700; color:#58a6ff;">2026-05-19 (화)</h2>
    </div>

    <!-- 슬로건 배너 -->
    <div class="slogan-banner">
      <p style="font-size:8pt; font-weight:700; color:#e94560; letter-spacing:0.02em;">
        8일입니다 — demo_script_draft.md 즉시 완성 / P8 코드 오전 / 로컬 학습 저녁
      </p>
    </div>

    <!-- 하단 생성자 -->
    <div class="footer-row">
      <span class="badge badge-muted">
        <p style="font-size:6.5pt; color:#8b949e;">EPL Scout Bot | 09:00 KST</p>
      </span>
      <span class="badge badge-muted">
        <p style="font-size:6.5pt; color:#8b949e;">김태현 스카우트 · Marcus Webb Analytics</p>
      </span>
    </div>

    <!-- 우하단 평점 배지 -->
    <div class="rating-panel">
      <p style="font-size:6.5pt; color:#8b949e; margin-bottom:2pt; letter-spacing:0.06em; text-transform:uppercase;">현재 평점</p>
      <p style="font-size:22pt; font-weight:800; color:#e94560; line-height:1.05;">4.55</p>
      <p style="font-size:8pt; color:#8b949e;">/ 5.0</p>
      <p style="font-size:7pt; font-weight:700; color:#e94560; margin-top:3pt;">&#9660; 4.60 하락</p>
    </div>
  </div>
</body>
</html>

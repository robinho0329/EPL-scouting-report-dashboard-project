<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 960px;
    height: 540px;
    background: #0d1117;
    font-family: 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
    color: #f8f9fa;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
</style>
</head>
<body>

  <!-- 상단 긴급 배너 -->
  <div style="width: 100%; background: #ff6b6b; padding: 9px 32px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
    <p style="font-size: 13px; font-weight: 700; color: #0d1117; letter-spacing: 0.02em; text-align: center;">
      수요일 — 4.0 이하 경고 집행 &nbsp;|&nbsp; P7·P1 16일 연속 미달 &nbsp;|&nbsp; 오늘 22시 최후 마감
    </p>
  </div>

  <!-- 메인 콘텐츠 -->
  <div style="flex: 1; display: flex; position: relative;">

    <!-- 좌측 수직 강조 라인 -->
    <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #ff6b6b;"></div>

    <!-- 타이틀 영역 -->
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 48px 0 28px;">

      <!-- 브랜드 배지 (div 래퍼 사용) -->
      <div style="margin-bottom: 18px;">
        <div style="display: inline-block; padding: 5px 16px; border: 1px solid #3D195B; border-radius: 20px;">
          <p style="font-size: 11px; font-weight: 600; color: #00d4ff; letter-spacing: 0.12em; text-transform: uppercase;">
            EPL Scout Intelligence
          </p>
        </div>
      </div>

      <!-- 메인 타이틀 -->
      <h1 style="font-size: 50px; font-weight: 800; color: #f8f9fa; letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 14px;">
        EPL 스카우트 인텔리전스
      </h1>

      <!-- 서브타이틀 -->
      <h2 style="font-size: 19px; font-weight: 500; color: #38d9a9; letter-spacing: -0.01em; margin-bottom: 26px; line-height: 1.4;">
        2026-05-27 (수) 데일리 브리핑 — 36번째 정기 미팅 &nbsp;|&nbsp; 09:00 KST
      </h2>

      <!-- 구분선 -->
      <div style="width: 56px; height: 3px; background: #ff6b6b; margin-bottom: 20px; border-radius: 2px;"></div>

      <!-- 참석자 -->
      <p style="font-size: 14px; color: #8b949e; font-weight: 400; line-height: 1.5;">
        김태현 스카우트 &nbsp;·&nbsp; Marcus Webb (Analytics Agent)
      </p>

    </div>

    <!-- 우측: 평점 배지 -->
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 220px; flex-shrink: 0; padding-right: 40px; gap: 12px;">

      <!-- 원형 게이지 (border trick, div 기반) -->
      <div style="width: 148px; height: 148px; border-radius: 50%; border: 14px solid #ff6b6b; background: #161b22; display: flex; align-items: center; justify-content: center;">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">
          <p style="font-size: 36px; font-weight: 800; color: #ff6b6b; line-height: 1; letter-spacing: -0.02em;">3.95</p>
          <p style="font-size: 13px; color: #8b949e; margin-top: 3px;">/ 5.0</p>
        </div>
      </div>

      <!-- 하락 표시 -->
      <p style="font-size: 14px; color: #ff6b6b; font-weight: 700; text-align: center;">&#9660; &minus;0.10</p>
      <p style="font-size: 11px; color: #8b949e; text-align: center;">전일 4.05</p>

      <!-- 경고 배지 (div 래퍼) -->
      <div style="background: rgba(255, 107, 107, 0.15); border: 1px solid #ff6b6b; border-radius: 8px; padding: 6px 12px; text-align: center; width: 100%;">
        <p style="font-size: 11px; font-weight: 700; color: #ff6b6b; line-height: 1.4;">4.0 이하 경고 집행</p>
        <p style="font-size: 10px; color: #8b949e; line-height: 1.4;">16일 연속 미달</p>
      </div>

    </div>

  </div>

  <!-- 하단 슬로건 박스 -->
  <div style="border-top: 1px solid #ff6b6b; background: rgba(255, 107, 107, 0.06); padding: 13px 48px; flex-shrink: 0;">
    <p style="font-size: 13px; color: #f8f9fa; font-style: italic; text-align: center; line-height: 1.5;">
      시스템 재설계 논의 개시. 오늘 저녁 22시가 마지노선. &nbsp;— 김태현
    </p>
  </div>

</body>
</html>

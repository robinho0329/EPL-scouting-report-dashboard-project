<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 720pt;
    height: 405pt;
    background: #0d1117;
    font-family: 'Pretendard', 'Noto Sans KR', -apple-system, sans-serif;
    color: #e6edf3;
    overflow: hidden;
    position: relative;
  }
  :root {
    --epl-accent: #e94560;
    --epl-gold: #f5a623;
    --epl-blue: #58a6ff;
    --epl-text: #e6edf3;
    --epl-muted: #8b949e;
    --epl-surface: #16213e;
  }
  .left-bar {
    position: absolute;
    left: 0; top: 0;
    width: 5pt; height: 100%;
    background: var(--epl-accent);
  }
  .top-badges {
    position: absolute;
    top: 18pt; left: 20pt; right: 145pt;
    display: flex;
    align-items: center;
    gap: 8pt;
    flex-wrap: nowrap;
  }
  .badge {
    display: inline-block;
    padding: 3pt 9pt;
    border-radius: 4pt;
    white-space: nowrap;
  }
  .badge-muted {
    background: rgba(139,148,158,0.12);
    border: 1pt solid #30363d;
  }
  .badge-gold {
    background: rgba(245,166,35,0.15);
    border: 1pt solid #f5a623;
  }
  .badge-danger {
    background: rgba(233,69,96,0.15);
    border: 2pt solid #e94560;
    box-shadow: 0 0 6pt rgba(233,69,96,0.35);
  }
  .center-content {
    position: absolute;
    top: 52pt; left: 20pt; right: 148pt;
  }
  .label-top {
    font-size: 8.5pt;
    letter-spacing: 0.22em;
    color: var(--epl-muted);
    text-transform: uppercase;
    margin-bottom: 8pt;
  }
  .main-title {
    font-size: 38pt;
    font-weight: 800;
    color: var(--epl-text);
    line-height: 1.05;
    margin-bottom: 6pt;
  }
  .sub-title {
    font-size: 14pt;
    font-weight: 600;
    color: var(--epl-blue);
    margin-bottom: 16pt;
  }
  .divider {
    width: 48pt; height: 3pt;
    background: var(--epl-accent);
    margin-bottom: 14pt;
  }
  .meta-line {
    font-size: 8.5pt;
    color: var(--epl-muted);
  }
  .rating-badge {
    position: absolute;
    right: 18pt; top: 48pt;
    width: 120pt;
    background: #16213e;
    border: 2pt solid #f5a623;
    border-radius: 10pt;
    padding: 12pt 10pt;
    text-align: center;
  }
  .rating-label {
    font-size: 8pt;
    color: var(--epl-muted);
    letter-spacing: 0.04em;
    margin-bottom: 3pt;
  }
  .rating-value {
    font-size: 30pt;
    font-weight: 800;
    color: #f5a623;
    line-height: 1;
    margin-bottom: 2pt;
  }
  .rating-denom {
    font-size: 10pt;
    color: var(--epl-muted);
    margin-bottom: 7pt;
  }
  .rating-change {
    display: inline-flex;
    align-items: center;
    gap: 3pt;
    background: rgba(233,69,96,0.14);
    border: 1pt solid #e94560;
    border-radius: 3pt;
    padding: 2pt 6pt;
  }
  .slogan-banner {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: rgba(233,69,96,0.10);
    border-top: 2pt solid #e94560;
    padding: 9pt 20pt;
    display: flex;
    align-items: center;
    gap: 10pt;
  }
  .slogan-text {
    font-size: 9.5pt;
    font-weight: 700;
    color: #e94560;
    flex: 1;
  }
  .slogan-meta {
    font-size: 8pt;
    color: var(--epl-muted);
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="left-bar"></div>

  <div class="top-badges">
    <span class="badge badge-muted">
      <p style="font-size:8pt; font-weight:700; color:#8b949e;">30번째 정기 미팅 | 09:00 KST</p>
    </span>
    <span class="badge badge-gold">
      <p style="font-size:8pt; font-weight:700; color:#f5a623;">포트폴리오 리허설 2일차</p>
    </span>
    <span class="badge badge-danger">
      <p style="font-size:8pt; font-weight:700; color:#e94560;">P7 + P1 10일 연속 미달</p>
    </span>
  </div>

  <div class="center-content">
    <p class="label-top">EPL Scout Intelligence</p>
    <h1 class="main-title">데일리 브리핑</h1>
    <p class="sub-title">2026-05-21 (목) | 아침 스카우트팀 미팅</p>
    <div class="divider"></div>
    <p class="meta-line">EPL Scout Bot &nbsp;|&nbsp; 2026-05-21 09:00 KST</p>
  </div>

  <div class="rating-badge">
    <p class="rating-label">현재 평가</p>
    <p class="rating-value">4.68</p>
    <p class="rating-denom">/ 5.0</p>
    <div class="rating-change">
      <p style="font-size:9pt; font-weight:700; color:#e94560;">&#9660; -0.02 (4.70)</p>
    </div>
  </div>

  <div class="slogan-banner">
    <p class="slogan-text">어제 합의 3건 중 0건 달성 — 오늘 저녁 로컬 PC를 켜십시오. 10일째입니다.</p>
    <p class="slogan-meta">EPL Scout Bot | 09:00 KST</p>
  </div>
</body>
</html>

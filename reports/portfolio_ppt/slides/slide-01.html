<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 720pt;
    height: 405pt;
    background: #0d1117;
    font-family: 'Pretendard', 'Noto Sans KR', -apple-system, sans-serif;
    color: #e6edf3;
    overflow: hidden;
    position: relative;
  }

  /* 좌측 강조 바 — solid color only */
  .left-bar {
    position: absolute;
    left: 0; top: 0;
    width: 5pt; height: 100%;
    background-color: #e94560;
  }

  /* 상단 영역 */
  .top-area {
    position: absolute;
    top: 20pt; left: 20pt; right: 20pt;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 8pt;
  }

  .shield-box {
    width: 32pt; height: 32pt;
    background-color: #1a1a2e;
    border: 1.4pt solid #e94560;
    border-radius: 4pt;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .shield-label {
    font-size: 7pt;
    font-weight: 800;
    color: #f5a623;
    letter-spacing: 0.04em;
  }

  .brand-text {
    font-size: 8.5pt;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: #8b949e;
    text-transform: uppercase;
  }

  .meeting-box {
    background-color: #1a1a2e;
    border: 1pt solid #30363d;
    border-radius: 20pt;
    padding: 3pt 10pt;
  }

  .meeting-text {
    font-size: 8pt;
    color: #8b949e;
  }

  /* 메인 콘텐츠 */
  .main-block {
    position: absolute;
    top: 70pt; left: 20pt;
    right: 115pt;
  }

  .dday-wrap {
    display: inline-block;
    background-color: #e94560;
    border-radius: 4pt;
    padding: 3pt 10pt;
    margin-bottom: 10pt;
  }

  .dday-text {
    font-size: 8.5pt;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: #ffffff;
  }

  .main-title {
    font-size: 34pt;
    font-weight: 800;
    line-height: 1.12;
    color: #e6edf3;
    margin-bottom: 6pt;
  }

  .sub-title {
    font-size: 13pt;
    font-weight: 500;
    color: #8b949e;
    margin-bottom: 14pt;
    letter-spacing: 0.03em;
  }

  .accent-bar {
    width: 44pt; height: 3pt;
    background-color: #e94560;
    border-radius: 2pt;
    margin-bottom: 14pt;
  }

  .slogan-wrap {
    background-color: #16213e;
    border-left: 4pt solid #e94560;
    border-radius: 4pt;
    padding: 8pt 12pt;
    max-width: 400pt;
  }

  .slogan-text {
    font-size: 8.5pt;
    color: #e6edf3;
    line-height: 1.7;
  }

  /* 우하단 평점 배지 */
  .rating-wrap {
    position: absolute;
    right: 20pt; bottom: 50pt;
    width: 88pt; height: 88pt;
    background-color: #1a1a2e;
    border: 2pt solid #f5a623;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .rating-num {
    font-size: 21pt;
    font-weight: 800;
    color: #f5a623;
    line-height: 1;
  }

  .rating-den {
    font-size: 7.5pt;
    color: #8b949e;
    margin-top: 2pt;
  }

  .rating-up {
    font-size: 8pt;
    font-weight: 700;
    color: #00d26a;
    margin-top: 3pt;
  }

  /* 푸터 */
  .footer-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 26pt;
    background-color: #1a1a2e;
    border-top: 1pt solid #30363d;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20pt;
  }

  .footer-text {
    font-size: 7.5pt;
    color: #8b949e;
  }
</style>
</head>
<body>
  <div class="left-bar"></div>

  <div class="top-area">
    <div class="brand-row">
      <div class="shield-box">
        <p class="shield-label">EPL</p>
      </div>
      <p class="brand-text">EPL Scout Intelligence</p>
    </div>
    <div class="meeting-box">
      <p class="meeting-text">29번째 정기 미팅 | 09:00 KST</p>
    </div>
  </div>

  <div class="main-block">
    <div class="dday-wrap">
      <p class="dday-text">포트폴리오 리허설 D-Day</p>
    </div>
    <h1 class="main-title">EPL 스카우트<br>인텔리전스</h1>
    <p class="sub-title">데일리 브리핑 &nbsp;|&nbsp; 2026-05-20 (수)</p>
    <div class="accent-bar"></div>
    <div class="slogan-wrap">
      <p class="slogan-text">리허설 D-Day — 5단계 발표 흐름 실전 검증<br>P7+P1 오늘 저녁 로컬 학습으로 9일 연속 미달 종결 예정</p>
    </div>
  </div>

  <div class="rating-wrap">
    <p class="rating-num">4.70</p>
    <p class="rating-den">/ 5.0</p>
    <p class="rating-up">&#8679; +0.15</p>
  </div>

  <div class="footer-bar">
    <p class="footer-text">김태현 스카우트 · Marcus Webb Analytics</p>
    <p class="footer-text">EPL Scout Bot | 2026-05-20 09:00 KST</p>
  </div>
</body>
</html>

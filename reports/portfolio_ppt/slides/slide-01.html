<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 720pt;
    height: 405pt;
    background: #0d1117;
    font-family: 'Pretendard', 'Noto Sans KR', -apple-system, sans-serif;
    color: #e6edf3;
    overflow: hidden;
    position: relative;
  }
  :root {
    --accent: #ff6b6b;
    --gold: #ffd43b;
    --green: #38d9a9;
    --muted: #8b949e;
    --surface: #16213e;
    --blue: #58a6ff;
  }
  .left-bar {
    position: absolute;
    left: 0; top: 0;
    width: 5pt; height: 100%;
    background: linear-gradient(180deg, var(--accent) 0%, #ff3355 100%);
  }
  .shield-icon {
    position: absolute;
    top: 16pt; right: 28pt;
    width: 36pt; height: 44pt;
    background: rgba(255,107,107,0.12);
    border: 1.5pt solid var(--accent);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    display: flex; align-items: center; justify-content: center;
  }
  .shield-icon p { font-size: 16pt; font-weight: 900; color: var(--accent); line-height: 1; }
  .main {
    position: absolute;
    top: 0; left: 5pt; right: 0; bottom: 52pt;
    padding: 16pt 28pt 0 28pt;
    display: flex;
    flex-direction: column;
  }
  .badge-row { display: flex; gap: 6pt; flex-wrap: wrap; margin-bottom: 9pt; }
  .badge {
    display: inline-flex; align-items: center;
    padding: 3pt 8pt; border-radius: 20pt;
    font-size: 7.5pt; font-weight: 700;
  }
  .b-gold  { background: rgba(255,212,59,0.14); border: 1pt solid var(--gold);   color: var(--gold); }
  .b-green { background: rgba(56,217,169,0.12);  border: 1pt solid var(--green); color: var(--green); }
  .b-red   { background: rgba(255,107,107,0.16); border: 1pt solid var(--accent); color: var(--accent); }
  .badge p { font-size: 7.5pt; font-weight: 700; }
  .title-block { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  p.eyebrow { font-size: 8.5pt; letter-spacing: 0.22em; color: var(--muted); text-transform: uppercase; margin-bottom: 7pt; }
  h1.main-title {
    font-size: 38pt; font-weight: 900; line-height: 1.05;
    color: #e6edf3; margin-bottom: 9pt;
  }
  h1.main-title span { color: var(--accent); }
  p.date-sub { font-size: 14pt; font-weight: 600; color: var(--muted); }
  p.date-sub span { color: var(--blue); }
  .rating-badge {
    position: absolute;
    right: 28pt; bottom: 60pt;
    background: rgba(255,107,107,0.12);
    border: 2pt solid var(--accent);
    border-radius: 10pt; padding: 9pt 16pt; text-align: center;
  }
  .rating-badge p.rl { font-size: 7.5pt; color: var(--muted); margin-bottom: 2pt; }
  .rating-badge p.rv { font-size: 28pt; font-weight: 900; color: var(--accent); line-height: 1; }
  .rating-badge p.rd { font-size: 10pt; font-weight: 800; color: var(--accent); }
  .rating-badge p.rp { font-size: 7.5pt; color: var(--muted); margin-top: 1pt; }
  .slogan {
    position: absolute;
    bottom: 0; left: 5pt; right: 0;
    height: 52pt;
    background: rgba(255,107,107,0.09);
    border-top: 2pt solid var(--accent);
    display: flex; align-items: center;
    padding: 0 28pt;
    gap: 10pt;
  }
  p.slogan-msg { font-size: 8.5pt; font-weight: 700; color: var(--accent); line-height: 1.45; flex: 1; }
  p.slogan-sub { font-size: 7.5pt; color: var(--muted); white-space: nowrap; }
</style>
</head>
<body>
  <div class="left-bar"></div>

  <div class="shield-icon">
    <p>E</p>
  </div>

  <div class="main">
    <div class="badge-row">
      <span class="badge b-gold"><p>32번째 정기 미팅 | 09:00 KST</p></span>
      <span class="badge b-green"><p>토요일 — 주말 긴급 점검</p></span>
      <span class="badge b-red"><p>P7 + P1 12일 연속 미달</p></span>
      <span class="badge b-red"><p>어제 금요일 경고 발동 — 3건 중 0건 달성</p></span>
    </div>

    <div class="title-block">
      <p class="eyebrow">EPL Scout Intelligence</p>
      <h1 class="main-title">EPL 스카우트<br><span>인텔리전스</span></h1>
      <p class="date-sub">데일리 브리핑 | <span>2026-05-23 (토)</span></p>
    </div>
  </div>

  <div class="rating-badge">
    <p class="rl">김태현 스카우트 평가</p>
    <p class="rv">4.38</p>
    <p class="rd">&#9660; -0.12</p>
    <p class="rp">전일 4.50 → 경고 반영</p>
  </div>

  <div class="slogan">
    <p class="slogan-msg">12일입니다. 오늘 저녁 push가 없으면 월요일 아침 4.20 이하입니다. 로컬 PC를 켜십시오.</p>
    <p class="slogan-sub">EPL Scout Bot | 09:00 KST</p>
  </div>
</body>
</html>
